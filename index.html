<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Card for Mummy Thapar</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <script>
        function handleImageError(img) {
            img.style.display = 'none';
            const parent = img.parentElement;
            const errorMsg = document.createElement('div');
            errorMsg.innerText = "Photo 'image_5aa36f.jpg' not found.";
            errorMsg.style.cssText = "color:#0052FF; padding:20px; text-align:center; font-family: 'Patrick Hand', cursive;";
            parent.prepend(errorMsg);
        }
    </script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --paper-color: #fffef2;
            --crayon-blue: #0052FF;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Patrick Hand', cursive;
        }

        /* Container for all pages */
        #page-manager {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--paper-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .page.prev {
            transform: translateX(-100%);
        }

        /* Content Styling */
        .crayon-text {
            font-family: 'Caveat', cursive;
            line-height: 1.1;
            text-align: center;
            color: var(--crayon-blue);
        }

        .broken-text span {
            display: inline-block;
            transform: rotate(var(--rot));
            margin: 0 -1px;
        }

        .title { font-size: 2.2rem; margin-bottom: 1rem; }

        /* Peacocks */
        .peacock {
            position: absolute;
            bottom: 20px;
            width: 120px;
            height: 120px;
            animation: p-dance 0.5s infinite alternate ease-in-out;
        }
        .peacock-left { left: 10px; }
        .peacock-right { right: 10px; transform: scaleX(-1); animation: p-dance-r 0.5s infinite alternate ease-in-out; }

        @keyframes p-dance { 0% { transform: translate(0, 0) rotate(-3deg); } 100% { transform: translate(6px, -15px) rotate(10deg); } }
        @keyframes p-dance-r { 0% { transform: scaleX(-1) translate(0, 0) rotate(-3deg); } 100% { transform: scaleX(-1) translate(6px, -15px) rotate(10deg); } }

        /* Photo Polaroid */
        .photo-polaroid {
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transform: rotate(-1.5deg);
            max-width: 90%;
            border: 1px solid #eee;
        }
        .photo-polaroid img {
            width: 100%;
            height: auto;
            max-height: 50vh;
            object-fit: cover;
            display: block;
        }

        /* Scribbles */
        .scribble {
            position: absolute;
            stroke: var(--crayon-blue);
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            width: 50px;
            height: 50px;
        }
        .scribble.tl { top: 20px; left: 20px; }
        .scribble.tr { top: 20px; right: 20px; }
        .scribble.bl { bottom: 20px; left: 20px; }
        .scribble.br { bottom: 20px; right: 20px; }

        /* Navigation Buttons */
        .nav-btn {
            background: #ff595e;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.1rem;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 8px rgba(255,89,94,0.3);
            font-family: inherit;
            z-index: 10;
        }

        .back-link {
            margin-top: 15px;
            color: #888;
            text-decoration: underline;
            font-size: 0.9rem;
            cursor: pointer;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 300;
        }

        .instruction {
            margin-top: 10px;
            color: #aaa;
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-5px);} }
    </style>
</head>
<body>

    <audio id="surpriseSong" loop preload="auto">
        <source src="birthday-gift-full-video-sharry-mann-mista-baaz-kaptaan-latest-punjabi-songs-2_KHXvv9Z4.mp3" type="audio/mpeg">
    </audio>

    <div id="page-manager">
        
        <!-- Page 1: Cover -->
        <div class="page active" id="page-1">
            <svg class="scribble tl" viewBox="0 0 50 50"><path d="M10 10 L25 20 L15 30 L35 40" /></svg>
            <svg class="scribble tr" viewBox="0 0 50 50"><path d="M10 40 L25 30 L15 20 L35 10" /></svg>
            <svg class="scribble bl" viewBox="0 0 50 50"><path d="M10 10 L25 20 L15 30 L35 40" /></svg>
            <svg class="scribble br" viewBox="0 0 50 50"><path d="M10 40 L25 30 L15 20 L35 10" /></svg>

            <div class="crayon-text mb-6">
                <h1 class="title broken-text">
                    <span style="--rot: -5deg">h</span><span style="--rot: 3deg">a</span><span style="--rot: -2deg">p</span><span style="--rot: 2deg">p</span><span style="--rot: 4deg">y</span><br>
                    <span style="--rot: 2deg">b</span><span style="--rot: -3deg">i</span><span style="--rot: 5deg">r</span><span style="--rot: -1deg">t</span><span style="--rot: 2deg">h</span><span style="--rot: -4deg">d</span><span style="--rot: 3deg">a</span><span style="--rot: 1deg">y</span><br>
                    <span style="--rot: -2deg">m</span><span style="--rot: 4deg">u</span><span style="--rot: -3deg">m</span><span style="--rot: 1deg">m</span><span style="--rot: -5deg">y</span><br>
                    <span style="--rot: 3deg">t</span><span style="--rot: -2deg">h</span><span style="--rot: 4deg">a</span><span style="--rot: -1deg">p</span><span style="--rot: 2deg">a</span><span style="--rot: -4deg">r</span>
                </h1>
            </div>

            <svg style="width:140px; height:160px; stroke: var(--crayon-blue); stroke-width: 3; fill: none;" viewBox="0 0 100 120">
                <path d="M40 30 L60 30 L50 10 Z" /><rect x="35" y="30" width="30" height="30" />
                <circle cx="43" cy="42" r="2.5" fill="var(--crayon-blue)" /><circle cx="57" cy="42" r="2.5" fill="var(--crayon-blue)" />
                <path d="M42 50 Q50 58 58 50" /><path d="M35 60 L65 60 L70 90 L30 90 Z" />
                <line x1="32" y1="70" x2="20" y2="75" /><line x1="68" y1="70" x2="80" y2="75" />
                <line x1="42" y1="90" x2="40" y2="105" /><line x1="58" y1="90" x2="60" y2="105" />
            </svg>

            <button class="nav-btn" onclick="nextPage(2)">Tap to Open Card</button>
        </div>

        <!-- Page 2: Cake -->
        <div class="page" id="page-2">
            <svg class="scribble tl" viewBox="0 0 50 50"><path d="M10 10 L25 20 L15 30 L35 40" /></svg>
            <svg class="scribble tr" viewBox="0 0 50 50"><path d="M10 40 L25 30 L15 20 L35 10" /></svg>

            <svg style="width:180px; height:180px; stroke: var(--crayon-blue); stroke-width: 2.5; fill: none;" viewBox="0 0 100 100">
                <rect x="30" y="40" width="40" height="25" /><rect x="25" y="65" width="50" height="25" />
                <text x="45" y="58" font-family="cursive" font-size="14" font-weight="bold" fill="var(--crayon-blue)" style="stroke:none">5</text>
                <text x="45" y="83" font-family="cursive" font-size="14" font-weight="bold" fill="var(--crayon-blue)" style="stroke:none">0</text>
                <line x1="50" y1="40" x2="50" y2="30" /><ellipse cx="50" cy="25" rx="3" ry="5" />
            </svg>
            <p class="crayon-text mt-4" style="font-size: 1.6rem; font-weight:bold;">Happy 50th Birthday!</p>
            
            <svg class="peacock peacock-left" viewBox="0 0 120 120">
                <defs><radialGradient id="grad-eye" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#caf0f8" /><stop offset="60%" style="stop-color:#00b4d8" /><stop offset="100%" style="stop-color:#023e8a" /></radialGradient></defs>
                <g transform="translate(60,110)"><path d="M-50,-80 Q0,-120 50,-80 L0,0 Z" fill="#2d6a4f" opacity="0.6" /><circle cx="-35" cy="-85" r="5" fill="url(#grad-eye)" /><circle cx="-15" cy="-105" r="6" fill="url(#grad-eye)" /><circle cx="15" cy="-105" r="6" fill="url(#grad-eye)" /><circle cx="35" cy="-85" r="5" fill="url(#grad-eye)" /></g>
                <path d="M60 110 Q45 105 45 80 C45 60 55 50 55 35" stroke="#023e8a" stroke-width="10" fill="none" stroke-linecap="round" /><circle cx="55" cy="30" r="7" fill="#023e8a" /><path d="M52 24 L50 18 M55 22 L55 16 M58 24 L60 18" stroke="#00b4d8" stroke-width="2" /><path d="M62 30 L68 33 L62 36 Z" fill="#fb8500" />
            </svg>

            <button class="nav-btn" onclick="nextPage(3)">Next Page</button>
            <div class="back-link" onclick="nextPage(1)">Back</div>
        </div>

        <!-- Page 3: Message -->
        <div class="page" id="page-3">
            <svg class="scribble tl" viewBox="0 0 50 50"><path d="M10 10 L25 20 L15 30 L35 40" /></svg>
            <svg class="scribble br" viewBox="0 0 50 50"><path d="M10 40 L25 30 L15 20 L35 10" /></svg>
            
            <div class="crayon-text" style="padding: 0 10px;">
                <h2 style="font-size:1.8rem; font-weight:bold; margin-bottom:10px;">MUMMY THAPAR</h2>
                <p style="font-size:1.2rem;">thankyou for being my bestfriend,</p>
                <p style="font-size:1.2rem;">i am so lucky to have you.</p>
                <p style="font-size:1.2rem; margin-top:15px; font-style:italic; font-weight:bold;">cant wait to peacock dance withyou.</p>
                
                <div style="margin-top:25px;">
                    <p style="font-size:1.1rem;">Love,</p>
                    <p style="font-size:1.8rem; font-weight:bold;">Arjun</p>
                </div>
            </div>

            <svg class="peacock peacock-right" viewBox="0 0 120 120">
                <g transform="translate(60,110)"><path d="M-50,-80 Q0,-120 50,-80 L0,0 Z" fill="#2d6a4f" opacity="0.6" /><circle cx="-35" cy="-85" r="5" fill="url(#grad-eye)" /><circle cx="-15" cy="-105" r="6" fill="url(#grad-eye)" /><circle cx="15" cy="-105" r="6" fill="url(#grad-eye)" /><circle cx="35" cy="-85" r="5" fill="url(#grad-eye)" /></g>
                <path d="M60 110 Q45 105 45 80 C45 60 55 50 55 35" stroke="#023e8a" stroke-width="10" fill="none" stroke-linecap="round" /><circle cx="55" cy="30" r="7" fill="#023e8a" /><path d="M52 24 L50 18 M55 22 L55 16 M58 24 L60 18" stroke="#00b4d8" stroke-width="2" /><path d="M62 30 L68 33 L62 36 Z" fill="#fb8500" />
            </svg>

            <button class="nav-btn" style="background:#ff595e;" onclick="nextPage(4)">Click for a Surprise!</button>
            <div class="back-link" onclick="nextPage(2)">Back</div>
        </div>

        <!-- Page 4: Photo -->
        <div class="page" id="page-4" style="background: #fff;">
            <div class="photo-polaroid">
                <img src="image_5aa36f.jpg" alt="Arjun and Mom" id="surprisePhoto" onerror="handleImageError(this)">
                <div class="crayon-text mt-4">
                    <p style="font-size:1.5rem; font-weight:bold;">Together Forever!</p>
                </div>
            </div>
            
            <button class="nav-btn" style="background:#888;" onclick="resetCard()">Start Over</button>
            <div class="back-link" onclick="nextPage(3)">Back to Message</div>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        let currentPage = 1;
        const song = document.getElementById('surpriseSong');
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function nextPage(num) {
            // Update audio logic
            if (num === 1) {
                song.pause();
                song.currentTime = 0;
            } else if (num === 4) {
                startConfetti();
                song.play().catch(e => console.log("Audio waiting for stronger gesture"));
            } else {
                // Prime audio on other transitions
                const p = song.play();
                if (p !== undefined) {
                    p.then(() => { if (currentPage !== 4) song.pause(); }).catch(() => {});
                }
            }

            // Page transitions
            const allPages = document.querySelectorAll('.page');
            allPages.forEach(p => {
                p.classList.remove('active', 'prev');
                const pNum = parseInt(p.id.split('-'));
                if (pNum < num) p.classList.add('prev');
            });

            document.getElementById(`page-${num}`).classList.add('active');
            currentPage = num;
            
            if (num === 4 || num === 1) startConfetti();
        }

        function resetCard() {
            nextPage(1);
        }

        // Confetti System
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createParticle() {
            return {
                x: Math.random() * canvas.width,
                y: -20,
                size: Math.random() * 8 + 4,
                color: ['#0052FF', '#00b4d8', '#ff595e', '#ffca3a'][Math.floor(Math.random() * 4)],
                speedX: Math.random() * 3 - 1.5,
                speedY: Math.random() * 3 + 2,
                rotation: Math.random() * 360,
                rotationSpeed: Math.random() * 10 - 5
            };
        }

        function startConfetti() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => { particles.push(createParticle()); }, i * 15);
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.speedX; p.y += p.speedY; p.rotation += p.rotationSpeed;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
                if (p.y > canvas.height) { particles.splice(i, 1); i--; }
            }
            requestAnimationFrame(updateParticles);
        }
        updateParticles();
    </script>
</body>
</html>
